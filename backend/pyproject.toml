[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pitwall"
version = "0.1.0"
description = "End-to-end F1 race-strategy toolkit: telemetry, tyre models, strategy simulation, race prediction."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dl = ["torch>=2.4"]
tracking = ["mlflow>=2.16"]
test = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pandas-stubs"]
dev = [
  "pitwall[test]",
  "jupyterlab>=4",
  "ipykernel",
  "matplotlib>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pitwall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Task tests and network tests are opt-in:  pytest -m task   /   pytest -m network
addopts = "-q -ra --strict-markers -m 'not network and not task'"
markers = [
  "network: needs internet access (OpenF1 / Jolpica downloads)",
  "task: checks for the hands-on tasks in docs/tasks; they fail until you implement them",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",  # pycodestyle
  "F",       # pyflakes
  "I",       # isort
  "B",       # bugbear
  "UP",      # pyupgrade
  "SIM",     # simplify
  "PTH",     # use pathlib
  "NPY",     # numpy
  "RUF",
]
ignore = ["E501"]  # the formatter handles line length

[tool.ruff.lint.isort]
known-first-party = ["pitwall"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# no type stubs published for these, or optional extras (torch: `dl`, mlflow: `tracking`)
# that CI's `test` install doesn't include
module = ["lightgbm.*", "mlflow.*", "scipy.*", "sklearn.*", "torch", "torch.*"]
ignore_missing_imports = true

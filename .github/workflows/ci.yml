# Continuous integration: every push and PR must pass lint, unit tests, the frontend build,
# the Docker build and an end-to-end smoke test before anything is deployed (see pages.yml,
# images.yml, which only run after this workflow succeeds on main).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[test]"
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Unit tests (offline) with coverage
        run: pytest --cov=pitwall --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Coverage summary
        if: matrix.python == '3.12'
        run: |
          python - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate")) * 100
          print(f"### Backend coverage: {rate:.1f}% of lines")
          EOF
      - uses: actions/upload-artifact@v7
        if: matrix.python == '3.12'
        with:
          name: coverage
          path: backend/coverage.xml

  tasks:
    # Your hands-on tasks fail until implemented, so this job never blocks CI: it just reports.
    name: Task scoreboard (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[test]"
      - run: pytest -m task --junitxml=tasks.xml -q || true
      - run: python scripts/task_scoreboard.py tasks.xml | tee -a "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend · lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Build (app)
        run: npm run build
      - name: Build (static demo mode compiles)
        run: npm run build:demo

  docker:
    name: Docker · build, containerised tests, e2e smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: docker compose build
      - name: Lint + tests inside the image
        run: docker compose run --rm test
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 120
      - name: End-to-end smoke test (nginx -> React + API)
        run: scripts/smoke.sh http://localhost:8080
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

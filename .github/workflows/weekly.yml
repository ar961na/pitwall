# Slow / external checks that shouldn't gate every PR:
#  * environment.yml still solves on conda-forge and the suite passes inside it
#  * live contract tests: OpenF1 [D1] and Jolpica [D2] still return what our parsers expect
name: Weekly checks

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - environment.yml
      - backend/pyproject.toml
      - .github/workflows/weekly.yml

permissions:
  contents: read

jobs:
  micromamba-env:
    name: environment.yml solves + tests pass in it
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          cache-environment: true
      - run: python -c "import torch, lightgbm, mlflow, pitwall; print(torch.__version__, lightgbm.__version__)"
      - working-directory: backend
        run: pytest

  live-apis:
    name: Live API contract tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[test]"
      - run: pytest -m network -v

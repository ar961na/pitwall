# Deploy the static demo to GitHub Pages.
# Called by ci.yml after every check passes on a push to main, rebuilt every Monday for fresh
# race-weekend data, or run by hand. It always builds the commit it was started for (never
# code from a pull request), so privileged deploys can't run untrusted code.
# The snapshot is the real API run against OpenF1 [D1] (python -m pitwall.static_demo) and is
# published under CC BY-NC-SA 4.0 like its source.
name: Deploy demo (GitHub Pages)

on:
  workflow_call:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC, after the race weekend
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PITWALL_DATA_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ./backend
      - name: Restore OpenF1 response cache
        uses: actions/cache@v6
        with:
          path: data/http_cache
          key: openf1-http-cache-${{ github.run_id }}
          restore-keys: openf1-http-cache-
      - name: Build API snapshot (live OpenF1, rate-limited)
        run: python -m pitwall.static_demo --out frontend/public/static-api
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build site
        working-directory: frontend
        env:
          VITE_STATIC_DEMO: "true"
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

# Continuous deployment of the static demo to GitHub Pages.
# Runs only after CI is green on main, every Monday (fresh race-weekend data), or by hand.
# The snapshot is built by running the real FastAPI app against OpenF1 [D1] in CI
# (python -m pitwall.static_demo) and is published under CC BY-NC-SA 4.0 like its source.
name: Deploy demo (GitHub Pages)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC, after the race weekend
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      PITWALL_DATA_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install ./backend
      - name: Restore OpenF1 response cache
        uses: actions/cache@v6
        with:
          path: data/http_cache
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-
      - name: Build API snapshot (live OpenF1, rate-limited)
        run: python -m pitwall.static_demo --out frontend/public/static-api
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build site
        working-directory: frontend
        env:
          VITE_STATIC_DEMO: "true"
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
